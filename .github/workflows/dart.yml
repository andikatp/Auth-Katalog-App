name: Dart & Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@3a4e6d3d1f4dea0753113d759b8f4a60082b444b # v4.7.0
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c48526dbb08b657d792e1bd7e9c0c091922737 # v2.18.0
        with:
          channel: "stable"
          cache: true

      - name: Install Dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run Code Generation
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Analyze Project Source
        run: flutter analyze

      - name: Run Tests
        run: flutter test
